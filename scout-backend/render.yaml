# render.yaml — Render Web Service specification for Tactica Scout API
#
# Only read when deployed as a Blueprint, and Render looks for it at the
# REPOSITORY ROOT. A service created by hand in the dashboard ignores this
# file entirely. To switch to Blueprint-managed config, move this file to
# the repo root (the rootDir below already points at scout-backend).
services:
  - type: web
    name: tactica-scout-api
    runtime: python
    plan: free
    region: frankfurt          # match the Supabase project's region
    rootDir: scout-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # PYTHON_VERSION is deliberately NOT set here. On Render it
      # outranks every other method, so a value here would pin the
      # patch release forever and silently override .python-version.
      # The version lives in scout-backend/.python-version instead,
      # which names the minor series and lets Render pick up security
      # patches on its own. pyenv reads the same file, so local dev
      # matches production.

      # Sports data
      - key: BSD_API_KEY
        sync: false

      # Supabase. Service role key bypasses RLS — backend only, never
      # expose it to a client. Anon key is only used as the `apikey`
      # header when asking the Auth server to validate a token.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
